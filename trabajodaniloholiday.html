<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Supervisor - Ó rdenes</title>
<link rel="stylesheet" href="supervisor.css">
</head>

<body>

<div class="todito">

    <aside class="barrad">
        <div class="logoinicial">
            <img src="imagen1.jpg.jpeg" class="imagen1">
        </div>

        <ul>
            <li onclick="mostrarSeccion('crear')">Crear Orden</li>
            <li onclick="mostrarSeccion('ordenes')">Órdenes</li>
            <li onclick="mostrarSeccion('tecnicos')">Técnicos</li>
            <li onclick="mostrarSeccion('reportes')">Reportes</li>
            <li onclick="cerrarSesion()">Cerrar Sesión</li>
        </ul>
    </aside>

    <main class="content">

        <header class="topbar">
            <h1>Panel del Supervisor</h1>
            <button class="btn">Perfil</button>
        </header>

        <div class="contenido-principal">

            <section id="crear" class="seccion activa">
                <h2>Crear Orden</h2>
                <form class="Viñetas">
                    <div class="campo">
                         <label>Numero de Orden</label>
                         <input type="text" placeholder="Ej: 01">
                    </div>
                    <div class="campo">
                        <label> Tecnico asignado</label>
                        <select>
                            <option>Seleccione un Tecnico</option>
                            <option>Operario 1</option>
                            <option> Operaio 2</option>
                            <option> Operario 3</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label>Descrpción del problema</label>
                        <textarea placeholder="Describa el problema"></textarea>
                    </div>
                    <div class="campo">
                        <label>Fecha</label>
                        <input type="date">
                    </div>
                    <button type="submit" class="btn">Crear Orden</button>
                </form>
            </section>

            <section id="ordenes" class="seccion">
                <h2>Órdenes</h2>
                <p>Listado de órdenes existentes.</p>
            </section>

            <section id="tecnicos" class="seccion">
                <h2>Técnicos</h2>
                <p>Información de técnicos asignados.</p>
            </section>

            <section id="reportes" class="seccion">
                <h2>Reportes</h2>
                <p>Reportes y estadísticas.</p>
            </section>

        </div>

    </main>

</div>

<script src="supervisor.js"></script>
</body>
</html>
